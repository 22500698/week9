<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const API_URL = "https://6ae2ab3dbbb54129229a387c.mockapi.io/products";
        let realProducts = [];
        let check = 0;
        let num = 0;
        window.addEventListener("load", () => {
            loadProducts();

            const searchBtn = document.getElementById("searchBtn");
            const dateSmall = document.getElementById("dateSmall");
            const dateBig = document.getElementById("dateBig");

            const name = document.querySelector("#name")
            const description = document.querySelector("#description")
            const date = document.querySelector("#date")
            const price = document.querySelector("#price")
            const category = document.querySelector("#category")


            const addBtn = document.getElementById("addBtn");
            searchBtn.addEventListener("click", (e) => {

                e.preventDefault();

                const productList = document.querySelector("#productList");
                productList.innerHTML = "";

                const products = realProducts.filter(p => {
                    return p.date >= dateSmall.value && p.date <= dateBig.value
                });

                renderProducts(products);
            })

            addBtn.addEventListener("click", (e) => {
                e.preventDefault();
                if (!name.checkValidity()) {
                    alert("제품명을 제대로 적으시오")
                    name.focus();
                    return;
                }

                if (!description.checkValidity()) {
                    alert("제품 설명을 제대로 적으시오")
                    description.focus();
                    return;
                }

                if (!price.checkValidity()) {
                    alert("가격을 제대로 적으시오")
                    price.focus();
                    return;
                }


                const newProduct = {
                    name: name.value,
                    description: description.value,
                    category: category.value,
                    date: date.value,
                    price: price.value,
                }


                if (check == 0) {
                    addProduct(newProduct);
                } else {
                    updateProduct(num, newProduct);
                    check = 0;
                }
            })
        })

        async function addProduct(products) {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(products)
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadProducts();
        }

        async function updateProduct(id, updatedData) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(updatedData)
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadProducts();
        }

        async function deleteProduct(id) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadProducts();
        }


        async function loadProducts() {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            realProducts = await response.json();
            renderProducts(realProducts);
        }

        function renderProducts(products) {
            const list = document.getElementById("productList");

            list.replaceChildren();
            products.forEach(product => {
                const li = document.createElement("li");
                const editBtn = document.createElement("button");
                const removeBtn = document.createElement("button");
                editBtn.textContent = "edit";
                removeBtn.textContent = 'X';
                li.textContent = `${product.name} (${product.price}) | ${product.category} | ${product.date} | ${product.description} |`;
                list.appendChild(li);
                li.appendChild(editBtn);
                li.appendChild(removeBtn);

                editBtn.addEventListener("click", () => {
                    document.querySelector("#name").value = product.name;
                    document.querySelector("#description").value = product.description;
                    document.querySelector("#category").value = product.category;
                    document.querySelector("#date").value = product.date;
                    document.querySelector("#price").value = product.price;

                    check = 1;
                    num = product.id;
                })

                removeBtn.addEventListener("click", () => {
                    if (confirm("삭제하시겠습니까?")) {
                        deleteProduct(product.id);
                    } else {
                        return
                    }
                })
            });
        }
    </script>
</head>

<body>
    <form>
        <label>상품명</label>
        <input required id="name" type="text" /><br>
        <label>설명</label>
        <input required id="description" type="text" /><br>
        <label>카테고리</label>
        <input required id="category" type="text" /><br>
        <label>생산날짜</label>
        <input required id="date" type="date" /><br>
        <label>가격</label>
        <input required id="price" type="number" /><br>

        <button id="addBtn" type="submit">추가하기</button>
    </form>


    <label>날짜 구간을 검색해보세요</label><br>
    <input style="width: 600px;" id="dateSmall" type="date" placeholder="작은 년도를 입력하세요" />
    <input style="width: 600px" id="dateBig" type="date" placeholder="큰 년도를 입력하세요" />
    <button id="searchBtn">검색</button>
    <ul id="productList"></ul>
</body>

</html>
