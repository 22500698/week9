<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const API_URL = "https://6ae2ab3dbbb54129229a387c.mockapi.io/products";
        let realProducts = [];
        window.addEventListener("load", () => {
            loadProducts();

            const name = document.querySelector("#name")
            const description = document.querySelector("#description")
            const date = document.querySelector("#date")
            const price = document.querySelector("#price")
            const category = document.querySelector("#category")


            const addBtn = document.getElementById("addBtn");

            addBtn.addEventListener("click", (e) => {
                e.preventDefault();
                if (!name.checkVisibility()) {
                    alert("제품명을 제대로 적으시오")
                    name.focus();
                    return;
                }

                if (!description.checkVisibility()) {
                    alert("제품 설명을 제대로 적으시오")
                    description.focus();
                    return;
                }

                if (!price.checkVisibility()) {
                    alert("가격을 제대로 적으시오")
                    price.focus();
                    return;
                }


                const newProduct = {
                    name: name.value,
                    description: description.value,
                    category: category.value,
                    date: date.value,
                    price: price.value,
                }

                addProduct(newProduct);
            })
        })

        async function addProduct(products) {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(products)
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadProducts();
        }

        async function deleteProduct(id) {
            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            await loadProducts();
        }


        async function loadProducts() {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            realProducts = await response.json();
            renderProducts(realProducts);
        }

        function renderProducts(products) {
            const list = document.getElementById("productList");

            list.replaceChildren();
            products.forEach(product => {
                const li = document.createElement("li");
                const removeBtn = document.createElement("button");
                removeBtn.textContent = 'X';
                li.textContent = `${product.name} (${product.price}) | ${product.category} | ${product.date} | ${product.description} |`;
                list.appendChild(li);
                li.appendChild(removeBtn);

                removeBtn.addEventListener("click", () => {
                    deleteProduct(product.id - 1);
                })
            });
        }
    </script>
</head>

<body>
    <form>
        <label>상품명</label>
        <input required id="name" type="text" /><br>
        <label>설명</label>
        <input required id="description" type="text" /><br>
        <label>카테고리</label>
        <input required id="category" type="text" /><br>
        <label>생산날짜</label>
        <input required id="date" type="date" /><br>
        <label>가격</label>
        <input required id="price" type="number" /><br>

        <button id="addBtn" type="submit">추가하기</button>
    </form>

    <ul id="productList"></ul>
</body>

</html>
